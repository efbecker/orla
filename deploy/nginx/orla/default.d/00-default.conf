# Default servers: answer requests whose Host matches no proxy host.
#
# The listen directives live in /etc/nginx/orla/runtime/*.conf, written by
# orla-nginx-prepare (ExecStartPre of nginx.service) after probing the Nginx
# build (HTTP/3) and the kernel (IPv6), so this file stays valid on every
# server.

# Port 80: serve ACME HTTP-01 challenges for any name, drop everything else.
server {
    include /etc/nginx/orla/runtime/listen-default-http.conf;
    server_name _;

    set $orla_host_id 0;

    include /etc/nginx/orla/snippets/acme-challenge.conf;

    location / {
        return 444;
    }
}

# Port 443: refuse the TLS handshake for unknown SNI names instead of leaking
# a certificate. The self-signed fallback certificate is only used by QUIC.
server {
    include /etc/nginx/orla/runtime/listen-default-https.conf;
    server_name _;

    set $orla_host_id 0;

    ssl_reject_handshake on;
    ssl_certificate     /etc/nginx/orla/runtime/fallback.crt;
    ssl_certificate_key /etc/nginx/orla/runtime/fallback.key;

    return 444;
}
