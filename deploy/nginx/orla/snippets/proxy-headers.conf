# Forwarded headers sent to every upstream. Included in each generated
# location because proxy_set_header is not inherited once a location
# declares its own headers.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Request-ID      $request_id;
proxy_set_header Connection        $orla_upstream_connection;
