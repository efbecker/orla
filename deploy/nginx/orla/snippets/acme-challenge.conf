# ACME HTTP-01 challenge. The panel writes token files to /var/lib/orla/acme
# and removes them once the order is validated.
location ^~ /.well-known/acme-challenge/ {
    alias /var/lib/orla/acme/;
    default_type text/plain;
    access_log off;
    auth_basic off;
    auth_request off;
    allow all;
}
