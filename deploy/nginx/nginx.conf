# /etc/nginx/nginx.conf (installed by deploy/install.sh)
#
# Base configuration for Orla on Debian 13. This file is static: the panel
# never rewrites it. Everything that depends on user data is compiled from
# the database into:
#
#   /etc/nginx/orla/generated/http.d/*.conf   global zones (rate limits, ...)
#   /etc/nginx/conf.d/host-{id}.conf          one file per proxy host
#
# The master process is managed by Debian's nginx.service (root, workers as
# www-data). The panel runs as `orla` and only calls `nginx -t` and
# `systemctl reload nginx` through the sudoers rules in deploy/sudoers/orla.

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/orla/nginx/error.log warn;

# Debian dynamic modules: brotli, headers-more, ...
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------
    # Core
    # -------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    server_tokens off;
    server_names_hash_bucket_size 128;
    server_names_hash_max_size 4096;
    variables_hash_max_size 2048;
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;
    reset_timedout_connection on;

    # -------------------------------------------------------------------
    # Variables shared by every generated host
    # -------------------------------------------------------------------

    # Connection header sent upstream: "upgrade" for WebSocket handshakes,
    # empty otherwise so upstream keepalive connections are reused.
    map $http_upgrade $orla_upstream_connection {
        default upgrade;
        ''      '';
    }

    # Cache status normalized for analytics (empty = not cacheable/no cache).
    map $upstream_cache_status $orla_cache_status {
        default $upstream_cache_status;
        ''      NONE;
    }

    # Requests the cache must skip: no-cache from the client or a session
    # cookie / Authorization header (never cache personalized responses).
    map $http_cache_control $orla_cache_bypass_client {
        default             0;
        ~*no-cache          1;
    }
    map $http_authorization $orla_cache_bypass_auth {
        default 1;
        ''      0;
    }

    # Static asset detection for cacheMode=STATIC_ONLY.
    map $uri $orla_is_static {
        default 0;
        ~*\.(?:css|js|mjs|map|json|xml|txt|ico|png|jpe?g|gif|webp|avif|svg|bmp|tiff?|woff2?|ttf|otf|eot|mp3|mp4|webm|ogg|wav|flac|m4a|mov|pdf|zip|gz|br|wasm)$ 1;
    }

    # Malicious user agents / vulnerability scanners
    # (used by snippets/block-bad-bots.conf).
    map $http_user_agent $orla_bad_bot {
        default 0;
        ~*(?:sqlmap|nikto|nmap|masscan|zgrab|nuclei|acunetix|netsparker|wpscan|dirbuster|gobuster|ffuf|feroxbuster|whatweb|jaeles|openvas|nessus|w3af|havij|commix|xsstrike|arachni|skipfish|zmeu|morfeus|fimap|libwww-perl|censysinspect) 1;
    }

    # $orla_host_id is set by every server block ("0" for the default
    # servers) and lets the log collector attribute traffic to a host.

    # -------------------------------------------------------------------
    # Structured access log (JSON), consumed by the panel log collector
    # -------------------------------------------------------------------
    log_format orla_json escape=json '{'
        '"time":"$time_iso8601",'
        '"msec":"$msec",'
        '"host_id":"$orla_host_id",'
        '"host":"$host",'
        '"server_name":"$server_name",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$request_id",'
        '"scheme":"$scheme",'
        '"protocol":"$server_protocol",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"query":"$args",'
        '"status":"$status",'
        '"bytes_sent":"$bytes_sent",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_length":"$request_length",'
        '"request_time":"$request_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"cache_status":"$orla_cache_status",'
        '"ssl_protocol":"$ssl_protocol",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/orla/nginx/access.json orla_json buffer=64k flush=1s;

    # -------------------------------------------------------------------
    # TLS defaults (Mozilla "intermediate"). Hosts override ssl_protocols
    # according to their minimum TLS version.
    # -------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:orla_ssl:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_early_data off;

    # -------------------------------------------------------------------
    # Proxy defaults. snippets/proxy-headers.conf sets the forwarded headers
    # inside every generated location.
    # -------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_redirect off;

    # -------------------------------------------------------------------
    # Compression (disabled by default, enabled per host)
    # -------------------------------------------------------------------
    gzip off;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/xml application/rss+xml application/atom+xml application/wasm image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    brotli off;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/xml application/rss+xml application/atom+xml application/wasm image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # -------------------------------------------------------------------
    # Global zones
    # -------------------------------------------------------------------

    # Baseline flood protection applied to every host with edge protection
    # enabled. Per-host rules get their own zones in generated/http.d.
    limit_req_zone  $binary_remote_addr zone=orla_global_req:20m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=orla_global_conn:20m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # Shared proxy cache. Purge removes the host's keys via the panel.
    proxy_cache_path /var/cache/orla/nginx/proxy levels=1:2 keys_zone=orla_cache:100m max_size=10g inactive=7d use_temp_path=off;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;

    # -------------------------------------------------------------------
    # Includes
    # -------------------------------------------------------------------
    include /etc/nginx/orla/generated/http.d/*.conf;
    include /etc/nginx/orla/default.d/*.conf;
    include /etc/nginx/conf.d/host-*.conf;
}
