# Drop-in for Debian's nginx.service, installed to
# /etc/systemd/system/nginx.service.d/orla.conf.
#
# orla-nginx-prepare must run before the stock `nginx -t`, because the default
# servers include files it generates (listen directives, fallback cert).
[Service]
ExecStartPre=
ExecStartPre=/usr/lib/orla/bin/orla-nginx-prepare
ExecStartPre=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'
LimitNOFILE=65535
